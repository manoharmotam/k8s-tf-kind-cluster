apiVersion: v1
kind: PersistentVolume
metadata:
  name: static-ebs-pv
spec:
  accessModes:
    - ReadWriteOnce
  capacity: 
   storage: 2Gi
  csi:
    driver: ebs.csi.aws.com
    fsType: ext4
    volumeHandle: vol-020f4a9ac6e814eae
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: static-ebs-pvc
spec:
  storageClassname: ""
  accessModes:
  - ReadWriteOnce
  volumeName: static-ebs-pv
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: ebs-static-pod
  labels:
    app.kubernetes.io/name: nginx
spec:
  nodeSelector:
    topology.kubernetes.io/zone: us-east-1b
  volumes:
  - name: persistent-store
    PersistentVolumeClaim:
      claimName: static-ebs-pvc
  containers:
  - name: nginx
    image: nginx:1.24
    volumeMounts: 
    - name: persistent-store
      mountPath: /var/log/nginx
    ports:
      - containerPort: 80