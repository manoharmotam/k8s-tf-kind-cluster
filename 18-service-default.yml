apiVersion: v1
kind: Service
metadata:
  name: default-svc
  labels:
    project: roboshop
    env: testing
    app: web-app
spec:
  selector:
    project: roboshop
    env: testing
    app: web-app
  ports:
  - port:  80
    protocol: TCP    
    targetPort: 80

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-svc-demo
  labels:
    project: roboshop
    env: testing
    app: web-app
spec:
  containers:
  - name: curl
    image: curlimages/curl
    args: 
    - "-X"
    - "GET"
    - "https://default-svc"
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
  - name: nginx-svc-demo
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
