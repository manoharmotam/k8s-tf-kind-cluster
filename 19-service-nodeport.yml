apiVersion: v1
kind: Service
metadata:
  name: nodeport-svc
  labels:
    project: roboshop
    env: testing
    app: web-app
spec:
  type: NodePort # this the default type. SVC picks cluster ip as type even if its not mentioned
  selector:
    project: roboshop
    env: testing
    app: web-app
  ports:
  - port:  80
    protocol: TCP    
    targetPort: 80
    nodePort: 31000

---

apiVersion: v1
kind: Pod
metadata:
  name: nginx-svc-demo
  labels:
    project: roboshop
    env: testing
    app: web-app
spec:
  containers:
  - name: nginx-svc-demo
    image: nginx
    resources:
      requests:
        memory: "64Mi"
        cpu: "250m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
